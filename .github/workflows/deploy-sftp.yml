name: Deploy to SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sftp-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required configuration
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          missing=0

          for name in SFTP_HOST SFTP_PORT SFTP_USERNAME SFTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done

          if echo "${SFTP_HOST}" | grep -Eq '^[a-zA-Z]+://|/|:'; then
            echo "::error::SFTP_HOST must be only a hostname or IP address, without protocol, port, path, or slashes."
            missing=1
          fi

          exit "${missing}"

      - name: Prepare changed files
        id: changed-files
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: |
          deploy_tag="sftp-deploy/latest"

          mkdir -p .deploy

          git fetch --force origin "refs/tags/${deploy_tag}:refs/tags/${deploy_tag}" || true

          if git rev-parse -q --verify "refs/tags/${deploy_tag}" >/dev/null; then
            base_sha="$(git rev-list -n 1 "${deploy_tag}")"
            echo "Preparing files changed since last successful deploy: ${base_sha}"
            git diff --name-only --diff-filter=ACMRT "${base_sha}" "${CURRENT_SHA}" > .deploy-files
          else
            echo "No previous deploy tag found; preparing all tracked files for first deploy."
            git ls-files > .deploy-files
          fi

          while IFS= read -r file; do
            case "${file}" in
              .github/*|.git/*)
                continue
                ;;
            esac

            if [ -f "${file}" ]; then
              mkdir -p ".deploy/$(dirname "${file}")"
              cp -- "${file}" ".deploy/${file}"
              echo "${file}" >> .deploy-manifest
            fi
          done < .deploy-files

          if [ -s .deploy-manifest ]; then
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            echo "Files prepared for deploy:"
            cat .deploy-manifest
          else
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "No changed deployable files found."
          fi

      - name: Deploy changed files
        if: steps.changed-files.outputs.has_changes == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './.deploy/*'
          remote_path: './'
          sftp_only: true

      - name: Mark successful deploy
        if: success()
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f sftp-deploy/latest "${CURRENT_SHA}"
          git push --force origin refs/tags/sftp-deploy/latest
